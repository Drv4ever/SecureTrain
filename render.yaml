services:
  - type: web
    name: securetrain-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/train_classifier.py
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: COMPANY_NAME
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: securetrain-db
          property: connectionString

databases:
  - name: securetrain-db
    plan: free
    databaseName: securetrain
    user: securetrain
